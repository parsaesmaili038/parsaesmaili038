<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1100"
    height="620"
    viewBox="0 0 1100 620"
>

<defs>

    <linearGradient
        id="background"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >
        <stop
            offset="0%"
            stop-color="#0D1117"
        />

        <stop
            offset="55%"
            stop-color="#111827"
        />

        <stop
            offset="100%"
            stop-color="#17113A"
        />
    </linearGradient>

    <linearGradient
        id="accent"
        x1="0"
        y1="0"
        x2="1"
        y2="0"
    >
        <stop
            offset="0%"
            stop-color="#58A6FF"
        />

        <stop
            offset="100%"
            stop-color="#7C3AED"
        />
    </linearGradient>

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="5"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

</defs>


