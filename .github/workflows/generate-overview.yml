name: Generate GitHub Overview

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

jobs:
  generate-overview:
    name: Generate Overview SVG
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate overview
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: parsaesmaili038
        run: |
          python scripts/github_overview.py

      - name: Upload overview artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-overview
          path: dist/github-stats/overview.svg
          if-no-files-found: error
