name: Generate GitHub Overview

on:
  workflow_dispatch:

  schedule:
    # Start once at 00:00 UTC, then wait for a random time
    # between 00:00 and 01:00 before generating the overview.
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  generate-overview:
    name: Generate Overview SVG
    runs-on: windows-latest

    steps:

      - name: Wait for random time
        shell: pwsh
        run: |
          $delay = Get-Random -Minimum 0 -Maximum 3600
          Write-Host "Waiting $delay seconds before generating the overview..."
          Start-Sleep -Seconds $delay

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate overview
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: the-par3a
        run: |
          python scripts/github_overview.py

      - name: Upload overview artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-overview
          path: dist/github-stats/overview.svg
          if-no-files-found: error
