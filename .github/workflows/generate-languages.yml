name: Generate GitHub Languages

on:
  workflow_dispatch:

  schedule:
    # Run once at 00:00 UTC, then wait for a random time
    # between 00:00 and 01:00 UTC.
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  generate-languages:
    name: Generate Languages SVG
    runs-on: windows-latest

    steps:
      - name: Wait for random time
        shell: pwsh
        run: |
          $delay = Get-Random -Minimum 0 -Maximum 3600
          Write-Host "Waiting $delay seconds before generating languages..."
          Start-Sleep -Seconds $delay

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate languages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: the-par3a
        run: |
          python scripts/github_languages.py

      - name: Upload generated SVG
        uses: actions/upload-artifact@v4
        with:
          name: github-languages
          path: dist/github-stats/languages.svg
          if-no-files-found: error
