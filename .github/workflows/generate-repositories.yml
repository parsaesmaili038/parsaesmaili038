name: Generate GitHub Repositories

on:
  workflow_dispatch:

  schedule:
    # Every day between 00:00 and 01:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  generate-repositories:
    name: Generate Repositories SVG
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate repositories
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: the-par3a
        run: |
          python scripts/github_repositories.py

      - name: Upload generated SVG
        uses: actions/upload-artifact@v4
        with:
          name: github-repositories
          path: dist/github-stats/repositories.svg
          if-no-files-found: error
