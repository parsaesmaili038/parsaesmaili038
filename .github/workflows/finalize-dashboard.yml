name: Finalize GitHub Dashboard

on:
  workflow_run:
    workflows:
      - Generate GitHub Overview
      - Generate GitHub Languages
      - Generate GitHub Activity
      - Generate GitHub Repositories
    types:
      - completed

  workflow_dispatch:

# جلوگیری از اجرای همزمان چند Finalize
concurrency:
  group: github-dashboard-finalize
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    name: Collect and Publish Dashboard

    runs-on: windows-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ==================================================
      # 1. Prepare temporary directory
      # ==================================================

      - name: Prepare dashboard directory
        shell: pwsh
        run: |
          if (Test-Path "final-dashboard") {
              Remove-Item `
                "final-dashboard" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "final-dashboard" `
            -Force | Out-Null

      # ==================================================
      # 2. Find matching successful workflow runs
      # ==================================================

      - name: Find artifact-producing workflow runs
        id: find-runs
        uses: actions/github-script@v8
        env:
          OVERVIEW_WORKFLOW: "Generate GitHub Overview"
          LANGUAGES_WORKFLOW: "Generate GitHub Languages"
          ACTIVITY_WORKFLOW: "Generate GitHub Activity"
          REPOSITORIES_WORKFLOW: "Generate GitHub Repositories"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const workflows = [
              {
                name: process.env.OVERVIEW_WORKFLOW,
                artifact: "github-overview"
              },
              {
                name: process.env.LANGUAGES_WORKFLOW,
                artifact: "github-languages"
              },
              {
                name: process.env.ACTIVITY_WORKFLOW,
                artifact: "github-activity"
              },
              {
                name: process.env.REPOSITORIES_WORKFLOW,
                artifact: "github-repositories"
              }
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            /*
             * When triggered by workflow_run, try to keep all
             * artifacts tied to the same commit.
             */
            const targetSha =
              context.payload.workflow_run?.head_sha ?? null;

            core.info(
              `Target commit SHA: ${targetSha ?? "not available"}`
            );

            /*
             * Fetch the repository workflows only once.
             */
            const workflowList =
              await github.paginate(
                github.rest.actions.listRepoWorkflows,
                {
                  owner,
                  repo,
                  per_page: 100
                }
              );

            const result = {};

            for (const item of workflows) {
              core.info("");
              core.info(`Searching workflow: ${item.name}`);

              const workflow =
                workflowList.find(
                  w => w.name === item.name
                );

              if (!workflow) {
                core.setFailed(
                  `Workflow not found: ${item.name}`
                );
                return;
              }

              core.info(
                `Found workflow ID: ${workflow.id}`
              );

              /*
               * Fetch recent completed runs only.
               * 20 is enough for normal operation and avoids
               * unnecessarily scanning hundreds of runs.
               */
              const runsResponse =
                await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  status: "completed",
                  per_page: 20
                });

              const runs =
                runsResponse.data.workflow_runs;

              /*
               * Prefer successful runs from the same commit.
               * This prevents mixing a fresh SVG with an older SVG.
               */
              const candidateRuns = runs.filter(
                run =>
                  run.conclusion === "success" &&
                  (!targetSha || run.head_sha === targetSha)
              );

              /*
               * If no same-SHA run exists during manual dispatch,
               * fall back to the latest successful run.
               */
              const fallbackRuns = runs.filter(
                run =>
                  run.conclusion === "success"
              );

              const runsToCheck =
                candidateRuns.length > 0
                  ? candidateRuns
                  : fallbackRuns;

              if (runsToCheck.length === 0) {
                core.setFailed(
                  `No successful runs found for workflow '${item.name}'.`
                );
                return;
              }

              let selectedRun = null;

              /*
               * Search recent successful runs until the expected
               * artifact is found.
               */
              for (const run of runsToCheck) {
                core.info(
                  `Checking run ${run.id} (${run.head_sha})`
                );

                const artifacts =
                  await github.paginate(
                    github.rest.actions.listWorkflowRunArtifacts,
                    {
                      owner,
                      repo,
                      run_id: run.id,
                      per_page: 100
                    }
                  );

                const artifact =
                  artifacts.find(
                    a =>
                      a.name === item.artifact &&
                      !a.expired
                  );

                if (!artifact) {
                  continue;
                }

                selectedRun = {
                  runId: run.id,
                  artifactName: artifact.name,
                  createdAt: run.created_at,
                  updatedAt: run.updated_at,
                  headSha: run.head_sha
                };

                break;
              }

              if (!selectedRun) {
                core.setFailed(
                  `No valid artifact '${item.artifact}' found for workflow '${item.name}'.`
                );
                return;
              }

              core.info(
                `Selected ${item.name}:`
              );

              core.info(
                `  Run ID: ${selectedRun.runId}`
              );

              core.info(
                `  Artifact: ${selectedRun.artifactName}`
              );

              core.info(
                `  Commit: ${selectedRun.headSha}`
              );

              core.info(
                `  Created: ${selectedRun.createdAt}`
              );

              result[item.artifact] = selectedRun;
            }

            core.setOutput(
              "runs",
              JSON.stringify(result)
            );

            core.info("");
            core.info(
              "Selected artifact-producing runs:"
            );

            core.info(
              JSON.stringify(
                result,
                null,
                2
              )
            );

      # ==================================================
      # 3. Download Overview
      # ==================================================

      - name: Download overview artifact
        uses: actions/download-artifact@v5
        with:
          name: github-overview
          path: final-dashboard/overview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-overview'].runId }}

      # ==================================================
      # 4. Download Languages
      # ==================================================

      - name: Download languages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-languages
          path: final-dashboard/languages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-languages'].runId }}

      # ==================================================
      # 5. Download Activity
      # ==================================================

      - name: Download activity artifact
        uses: actions/download-artifact@v5
        with:
          name: github-activity
          path: final-dashboard/activity
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-activity'].runId }}

      # ==================================================
      # 6. Download Repositories
      # ==================================================

      - name: Download repositories artifact
        uses: actions/download-artifact@v5
        with:
          name: github-repositories
          path: final-dashboard/repositories
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-repositories'].runId }}

      # ==================================================
      # 7. Validate dashboard files
      # ==================================================

      - name: Validate dashboard files
        shell: pwsh
        run: |

          $requiredFiles = @(
              "overview.svg",
              "languages.svg",
              "activity.svg",
              "repositories.svg"
          )

          $errors = @()

          foreach ($file in $requiredFiles) {

              $matches = @(
                  Get-ChildItem `
                    -Path "final-dashboard" `
                    -Recurse `
                    -Filter $file `
                    -File
              )

              if ($matches.Count -eq 0) {

                  $errors += `
                    "Missing required file: $file"

                  continue
              }

              if ($matches.Count -gt 1) {

                  $errors += `
                    "Duplicate file detected: $file"

                  continue
              }

              $match = $matches[0]

              $size = $match.Length

              if ($size -le 100) {

                  $errors += `
                    "Suspiciously small file: $file ($size bytes)"

                  continue
              }

              Write-Host `
                "Validated: $($match.FullName) [$size bytes]"
          }

          if ($errors.Count -gt 0) {

              Write-Host ""
              Write-Host "Validation errors:"

              foreach ($error in $errors) {
                  Write-Host " - $error"
              }

              exit 1
          }

          Write-Host ""
          Write-Host "All dashboard files are valid."

      # ==================================================
      # 8. Checkout gh-pages
      # ==================================================

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      # ==================================================
      # 9. Prepare published directory
      # ==================================================

      - name: Prepare published dashboard
        shell: pwsh
        run: |

          $publishPath = "gh-pages/github-stats"

          if (Test-Path $publishPath) {

              Remove-Item `
                $publishPath `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $publishPath `
            -Force | Out-Null

      # ==================================================
      # 10. Publish dashboard
      # ==================================================

      - name: Publish dashboard files
        shell: pwsh
        run: |

          $files = @(
              "overview.svg",
              "languages.svg",
              "activity.svg",
              "repositories.svg"
          )

          foreach ($file in $files) {

              $source = Get-ChildItem `
                -Path "final-dashboard" `
                -Recurse `
                -Filter $file `
                -File |
                Select-Object -First 1

              if (-not $source) {

                  Write-Error `
                    "Cannot publish '$file'. File not found."

                  exit 1
              }

              $destination = Join-Path `
                "gh-pages/github-stats" `
                $file

              Copy-Item `
                $source.FullName `
                $destination `
                -Force

              Write-Host `
                "Published: $file"
          }

      # ==================================================
      # 11. Final verification
      # ==================================================

      - name: Verify gh-pages output
        shell: pwsh
        run: |

          $requiredFiles = @(
              "overview.svg",
              "languages.svg",
              "activity.svg",
              "repositories.svg"
          )

          foreach ($file in $requiredFiles) {

              $path = Join-Path `
                "gh-pages/github-stats" `
                $file

              if (-not (Test-Path $path)) {

                  Write-Error `
                    "Published file missing: $file"

                  exit 1
              }

              $size = (
                  Get-Item $path
              ).Length

              if ($size -le 100) {

                  Write-Error `
                    "Published file is suspiciously small: $file"

                  exit 1
              }

              Write-Host `
                "OK: $file [$size bytes]"
          }

          Write-Host ""
          Write-Host "Dashboard publication validation passed."

      # ==================================================
      # 12. Commit and push
      # ==================================================

      - name: Commit dashboard
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |

          Set-Location "gh-pages"

          git config `
            user.name `
            "github-actions[bot]"

          git config `
            user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats/

          $changes = git status --porcelain

          if (-not $changes) {

              Write-Host ""
              Write-Host "No dashboard changes detected."
              Write-Host "Nothing to commit."

              exit 0
          }

          Write-Host ""
          Write-Host "Dashboard changes detected:"
          git status --short

          $commitSubject =
            "📊 chore(dashboard): update GitHub analytics"

          $commitBody = @"
Automated GitHub dashboard synchronization.

Generated-By: github-actions[bot]
Workflow: Finalize GitHub Dashboard
Repository: $env:REPOSITORY
Run-ID: $env:WORKFLOW_RUN_ID
"@

          git commit `
            -m $commitSubject `
            -m $commitBody

          git push origin gh-pages

          Write-Host ""
          Write-Host "Dashboard successfully published."
