name : Finalize GitHub Dashboard

on:
  workflow_run:
    workflows:
      - Generate GitHub Overview
      - Generate GitHub Languages
      - Generate GitHub Activity
      - Generate GitHub Contributions
    types:
      - completed

  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    name: Collect and Publish Dashboard
    runs-on: windows-latest

    # --------------------------------------------------
    # Finalizer فقط با موفقیت اجرا شدن workflow آغازگر
    # ادامه پیدا می‌کند.
    # --------------------------------------------------

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # --------------------------------------------------
      # 1. Checkout main
      # --------------------------------------------------

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Prepare temporary directory
      # --------------------------------------------------

      - name: Prepare dashboard directory
        shell: pwsh
        run: |
          if (Test-Path "final-dashboard") {
              Remove-Item "final-dashboard" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "final-dashboard" `
            -Force | Out-Null


      # --------------------------------------------------
      # 3. Find latest successful runs
      # --------------------------------------------------

      - name: Find artifact-producing workflow runs
        id: find-runs
        uses: actions/github-script@v8
        env:
          OVERVIEW_WORKFLOW: "Generate GitHub Overview"
          LANGUAGES_WORKFLOW: "Generate GitHub Languages"
          ACTIVITY_WORKFLOW: "Generate GitHub Activity"
          CONTRIBUTIONS_WORKFLOW: "Generate GitHub Contributions"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflows = [
              {
                name: process.env.OVERVIEW_WORKFLOW,
                artifact: "github-overview"
              },
              {
                name: process.env.LANGUAGES_WORKFLOW,
                artifact: "github-languages"
              },
              {
                name: process.env.ACTIVITY_WORKFLOW,
                artifact: "github-activity"
              },
              {
                name: process.env.CONTRIBUTIONS_WORKFLOW,
                artifact: "github-contributions"
              }
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const result = {};

            for (const item of workflows) {

              core.info(
                `Searching workflow: ${item.name}`
              );

              const workflowList =
                await github.paginate(
                  github.rest.actions.listRepoWorkflows,
                  {
                    owner,
                    repo,
                    per_page: 100
                  }
                );

              const workflow =
                workflowList.find(
                  w => w.name === item.name
                );

              if (!workflow) {
                core.setFailed(
                  `Workflow not found: ${item.name}`
                );
                return;
              }

              const runs =
                await github.paginate(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id: workflow.id,
                    status: "completed",
                    per_page: 100
                  }
                );

              const successfulRuns =
                runs.filter(
                  run => run.conclusion === "success"
                );

              let selectedRun = null;

              for (const run of successfulRuns) {

                const artifacts =
                  await github.paginate(
                    github.rest.actions.listWorkflowRunArtifacts,
                    {
                      owner,
                      repo,
                      run_id: run.id,
                      per_page: 100
                    }
                  );

                const artifact =
                  artifacts.find(
                    a =>
                      a.name === item.artifact &&
                      !a.expired
                  );

                if (artifact) {
                  selectedRun = {
                    runId: run.id,
                    artifactName: artifact.name,
                    createdAt: run.created_at
                  };

                  break;
                }
              }

              if (!selectedRun) {
                core.setFailed(
                  `No successful run with artifact '${item.artifact}' was found for workflow '${item.name}'.`
                );
                return;
              }

              core.info(
                `Selected ${item.name}: run ${selectedRun.runId}, artifact ${selectedRun.artifactName}`
              );

              result[item.artifact] = selectedRun;
            }

            core.setOutput(
              "runs",
              JSON.stringify(result)
            );

            core.info(
              `Selected runs: ${JSON.stringify(result, null, 2)}`
            );


      # --------------------------------------------------
      # 4. Download Overview
      # --------------------------------------------------

      - name: Download overview artifact
        uses: actions/download-artifact@v5
        with:
          name: github-overview
          path: final-dashboard/overview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-overview'].runId }}


      # --------------------------------------------------
      # 5. Download Languages
      # --------------------------------------------------

      - name: Download languages artifact
        uses: actions/download-artifact@v5
        with:
          name: github-languages
          path: final-dashboard/languages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-languages'].runId }}


      # --------------------------------------------------
      # 6. Download Activity
      # --------------------------------------------------

      - name: Download activity artifact
        uses: actions/download-artifact@v5
        with:
          name: github-activity
          path: final-dashboard/activity
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-activity'].runId }}


      # --------------------------------------------------
      # 7. Download Contributions
      # --------------------------------------------------

      - name: Download contributions artifact
        uses: actions/download-artifact@v5
        with:
          name: github-contributions
          path: final-dashboard/contributions
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(steps.find-runs.outputs.runs)['github-contributions'].runId }}


      # --------------------------------------------------
      # 8. Validate ALL SVG files
      # --------------------------------------------------

      - name: Validate dashboard files
        shell: pwsh
        run: |

          $requiredFiles = @(
              "overview.svg",
              "languages.svg",
              "activity.svg",
              "contributions.svg"
          )

          foreach ($file in $requiredFiles) {

              $matches = @(
                  Get-ChildItem `
                    -Path "final-dashboard" `
                    -Recurse `
                    -Filter $file `
                    -File
              )

              if ($matches.Count -eq 0) {

                  Write-Error `
                    "Required file '$file' was not found."

                  exit 1
              }

              if ($matches.Count -gt 1) {

                  Write-Error `
                    "Duplicate file '$file' detected."

                  exit 1
              }

              $match = $matches[0]

              $size = $match.Length

              if ($size -le 100) {

                  Write-Error `
                    "File '$($match.FullName)' is suspiciously small."

                  exit 1
              }

              Write-Host `
                "Validated: $($match.FullName) [$size bytes]"
          }

          Write-Host ""
          Write-Host "All required dashboard files are valid."


      # --------------------------------------------------
      # 9. Checkout gh-pages
      # --------------------------------------------------

      - name: Checkout gh-pages
        shell: pwsh
        run: |

          git fetch origin gh-pages

          git checkout `
            -B gh-pages `
            origin/gh-pages


      # --------------------------------------------------
      # 10. Prepare published directory
      # --------------------------------------------------

      - name: Prepare published dashboard
        shell: pwsh
        run: |

          if (-not (Test-Path "github-stats")) {

              New-Item `
                -ItemType Directory `
                -Path "github-stats" `
                -Force | Out-Null
          }


      # --------------------------------------------------
      # 11. Publish validated SVG files
      # --------------------------------------------------

      - name: Publish dashboard files
        shell: pwsh
        run: |

          $files = @(
              "overview.svg",
              "languages.svg",
              "activity.svg",
              "contributions.svg"
          )

          foreach ($file in $files) {

              $source = Get-ChildItem `
                -Path "final-dashboard" `
                -Recurse `
                -Filter $file `
                -File |
                Select-Object -First 1

              if (-not $source) {

                  Write-Error `
                    "Cannot publish '$file' because it was not found."

                  exit 1
              }

              Copy-Item `
                $source.FullName `
                (Join-Path "github-stats" $file) `
                -Force

              Write-Host `
                "Published: $file"
          }


      # --------------------------------------------------
      # 12. Final verification
      # --------------------------------------------------

      - name: Verify gh-pages output
        shell: pwsh
        run: |

          $requiredFiles = @(
              "overview.svg",
              "languages.svg",
              "activity.svg",
              "contributions.svg"
          )

          foreach ($file in $requiredFiles) {

              $path = Join-Path `
                "github-stats" `
                $file

              if (-not (Test-Path $path)) {

                  Write-Error `
                    "Published file missing: $file"

                  exit 1
              }

              $size = (
                  Get-Item $path
              ).Length

              if ($size -le 100) {

                  Write-Error `
                    "Published file is suspiciously small: $file"

                  exit 1
              }

              Write-Host `
                "OK: $file [$size bytes]"
          }

          Write-Host ""
          Write-Host "Dashboard publication validation passed."


      # --------------------------------------------------
      # 13. Commit only if something actually changed
      # --------------------------------------------------

      - name: Commit dashboard
        shell: pwsh
        run: |

          git config `
            user.name `
            "github-actions[bot]"

          git config `
            user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats/

          $changes = git status --porcelain

          if (-not $changes) {

              Write-Host ""
              Write-Host "No dashboard changes detected."
              Write-Host "Nothing to commit."

              exit 0
          }

          Write-Host ""
          Write-Host "Changes detected:"
          git status --short

          git commit `
            -m "Update GitHub dashboard"

          git push origin gh-pages

