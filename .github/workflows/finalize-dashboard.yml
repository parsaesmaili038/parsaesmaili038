
name: Finalize GitHub Dashboard

# ================================================================
# GitHub Dashboard Finalizer
# ================================================================
#
# PURPOSE
# -------
# Collects the SVG dashboard artifacts generated by the following
# workflows:
#
#   - Generate GitHub Overview
#   - Generate GitHub Languages
#   - Generate GitHub Activity
#   - Generate GitHub Repositories
#
# Then:
#   1. Validates the downloaded dashboard files.
#   2. Optionally generates dashboard metadata.
#   3. Optionally injects XML metadata into SVG files.
#   4. Calculates SHA-256 and SHA-512 integrity hashes.
#   5. Publishes the dashboard to the gh-pages branch.
#   6. Optionally publishes metadata and an integrity manifest.
#
#
# ================================================================
# METADATA CONTROL
# ================================================================
#
# Change ONLY the value below:
#
#   "1" = Metadata features ENABLED
#   "0" = Metadata features DISABLED
#
# When disabled:
#   - No JSON metadata is generated.
#   - No XML metadata is injected into SVG files.
#   - No metadata files are published.
#   - No publication manifest is generated.
#   - Previously published metadata is removed because the
#     github-stats directory is recreated before publication.
#
# When enabled:
#   - metadata.json is generated.
#   - final-metadata.json is generated.
#   - XML metadata is embedded into every SVG.
#   - manifest.json is generated.
#   - SHA-256 and SHA-512 hashes are recorded.
#
# IMPORTANT
# ---------
# Hashing is NOT encryption.
#
# SHA-256 and SHA-512 provide cryptographic integrity fingerprints.
# They do not hide, encrypt, or make the original data secret.
#
# ================================================================
env:
  ENABLE_METADATA: "0"


# ================================================================
# SECURITY NOTES
# ================================================================
#
# GitHub Actions security:
#
# - The workflow uses the automatically provided GITHUB_TOKEN.
# - The token is limited by the permissions declared below.
# - Actions permission is READ-only.
# - Contents permission is WRITE because the workflow must publish
#   the generated dashboard to the gh-pages branch.
#
# The workflow does NOT intentionally print:
#   - GITHUB_TOKEN
#   - Personal Access Tokens
#   - SSH private keys
#   - Repository secrets
#
# Never place secrets directly inside this YAML file.
#
# For stronger repository security, also consider enabling:
#   - Branch protection rules
#   - Required status checks
#   - GitHub Actions approval rules
#   - Dependabot updates
#   - Code scanning
#   - Secret scanning
#
# ================================================================

on:
  workflow_run:
    workflows:
      - Generate GitHub Overview
      - Generate GitHub Languages
      - Generate GitHub Activity
      - Generate GitHub Repositories
    types:
      - completed

  workflow_dispatch:


# Prevent multiple finalization jobs from modifying gh-pages
# simultaneously.
concurrency:
  group: github-dashboard-finalize
  cancel-in-progress: true


# Minimal permissions required by this workflow.
permissions:
  actions: read
  contents: write


jobs:

  # ================================================================
  # FINALIZE DASHBOARD
  # ================================================================

  finalize:
    name: Collect, Enrich and Publish Dashboard
    runs-on: windows-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'


    steps:

      # ==============================================================
      # 1. Prepare temporary directories
      # ==============================================================

      - name: Prepare temporary directories
        shell: pwsh
        run: |

          $directories = @(
              "final-dashboard",
              "dashboard-metadata"
          )

          foreach ($directory in $directories) {

              if (Test-Path $directory) {

                  Remove-Item `
                    $directory `
                    -Recurse `
                    -Force
              }

              New-Item `
                -ItemType Directory `
                -Path $directory `
                -Force | Out-Null
          }

          Write-Host "Temporary directories prepared."

          if ($env:ENABLE_METADATA -eq "1") {

              Write-Host "Metadata processing: ENABLED"
              Write-Host "Integrity hashes: SHA-256 + SHA-512"

          }
          else {

              Write-Host "Metadata processing: DISABLED"
              Write-Host "SVG files will remain unchanged."

          }


      # ==============================================================
      # 2. Find matching artifact-producing workflow runs
      # ==============================================================

      - name: Find artifact-producing workflow runs
        id: find-runs
        uses: actions/github-script@v8

        env:

          OVERVIEW_WORKFLOW: "Generate GitHub Overview"
          LANGUAGES_WORKFLOW: "Generate GitHub Languages"
          ACTIVITY_WORKFLOW: "Generate GitHub Activity"
          REPOSITORIES_WORKFLOW: "Generate GitHub Repositories"

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const workflows = [

              {
                name: process.env.OVERVIEW_WORKFLOW,
                artifact: "github-overview"
              },

              {
                name: process.env.LANGUAGES_WORKFLOW,
                artifact: "github-languages"
              },

              {
                name: process.env.ACTIVITY_WORKFLOW,
                artifact: "github-activity"
              },

              {
                name: process.env.REPOSITORIES_WORKFLOW,
                artifact: "github-repositories"
              }

            ];


            const owner = context.repo.owner;
            const repo = context.repo.repo;


            const targetSha =
              context.payload.workflow_run?.head_sha ?? null;


            core.info(
              `Target commit SHA: ${targetSha ?? "not available"}`
            );


            const workflowList =
              await github.paginate(
                github.rest.actions.listRepoWorkflows,
                {
                  owner,
                  repo,
                  per_page: 100
                }
              );


            const result = {};


            for (const item of workflows) {

              core.info("");
              core.info(`Searching workflow: ${item.name}`);


              const workflow =
                workflowList.find(
                  workflow => workflow.name === item.name
                );


              if (!workflow) {

                core.setFailed(
                  `Workflow not found: ${item.name}`
                );

                return;
              }


              core.info(
                `Workflow ID: ${workflow.id}`
              );


              const runsResponse =
                await github.rest.actions.listWorkflowRuns({

                  owner,
                  repo,

                  workflow_id: workflow.id,

                  status: "completed",

                  per_page: 30

                });


              const runs =
                runsResponse.data.workflow_runs;


              const sameShaRuns =
                runs.filter(
                  run =>
                    run.conclusion === "success" &&
                    (!targetSha || run.head_sha === targetSha)
                );


              const successfulRuns =
                runs.filter(
                  run =>
                    run.conclusion === "success"
                );


              const runsToCheck =
                sameShaRuns.length > 0
                  ? sameShaRuns
                  : successfulRuns;


              if (runsToCheck.length === 0) {

                core.setFailed(
                  `No successful runs found for workflow '${item.name}'.`
                );

                return;
              }


              let selectedRun = null;


              for (const run of runsToCheck) {

                core.info(
                  `Checking run ${run.id} (${run.head_sha})`
                );


                const artifacts =
                  await github.paginate(
                    github.rest.actions.listWorkflowRunArtifacts,
                    {
                      owner,
                      repo,
                      run_id: run.id,
                      per_page: 100
                    }
                  );


                const artifact =
                  artifacts.find(
                    artifact =>
                      artifact.name === item.artifact &&
                      !artifact.expired
                  );


                if (!artifact) {
                  continue;
                }


                selectedRun = {

                  workflowName: item.name,
                  workflowId: workflow.id,

                  runId: run.id,
                  runNumber: run.run_number,

                  artifactId: artifact.id,
                  artifactName: artifact.name,

                  artifactSize:
                    artifact.size_in_bytes,

                  createdAt:
                    run.created_at,

                  updatedAt:
                    run.updated_at,

                  runAttempt:
                    run.run_attempt,

                  headSha:
                    run.head_sha,

                  headBranch:
                    run.head_branch,

                  event:
                    run.event,

                  actor:
                    run.actor?.login ?? null

                };


                break;
              }


              if (!selectedRun) {

                core.setFailed(
                  `No valid artifact '${item.artifact}' found for workflow '${item.name}'.`
                );

                return;
              }


              result[item.artifact] = selectedRun;


              core.info(
                JSON.stringify(
                  selectedRun,
                  null,
                  2
                )
              );

            }


            core.setOutput(
              "runs",
              JSON.stringify(result)
            );


            core.info("");
            core.info("Selected artifact-producing runs:");


            core.info(
              JSON.stringify(
                result,
                null,
                2
              )
            );


      # ==============================================================
      # 3. Download Overview
      # ==============================================================

      - name: Download overview artifact
        uses: actions/download-artifact@v5

        with:

          name: github-overview

          path: final-dashboard/overview

          github-token: ${{ secrets.GITHUB_TOKEN }}

          repository:
            ${{ github.repository }}

          run-id:
            ${{ fromJSON(steps.find-runs.outputs.runs)['github-overview'].runId }}


      # ==============================================================
      # 4. Download Languages
      # ==============================================================

      - name: Download languages artifact
        uses: actions/download-artifact@v5

        with:

          name: github-languages

          path: final-dashboard/languages

          github-token: ${{ secrets.GITHUB_TOKEN }}

          repository:
            ${{ github.repository }}

          run-id:
            ${{ fromJSON(steps.find-runs.outputs.runs)['github-languages'].runId }}


      # ==============================================================
      # 5. Download Activity
      # ==============================================================

      - name: Download activity artifact
        uses: actions/download-artifact@v5

        with:

          name: github-activity

          path: final-dashboard/activity

          github-token: ${{ secrets.GITHUB_TOKEN }}

          repository:
            ${{ github.repository }}

          run-id:
            ${{ fromJSON(steps.find-runs.outputs.runs)['github-activity'].runId }}


      # ==============================================================
      # 6. Download Repositories
      # ==============================================================

      - name: Download repositories artifact
        uses: actions/download-artifact@v5

        with:

          name: github-repositories

          path: final-dashboard/repositories

          github-token: ${{ secrets.GITHUB_TOKEN }}

          repository:
            ${{ github.repository }}

          run-id:
            ${{ fromJSON(steps.find-runs.outputs.runs)['github-repositories'].runId }}


      # ==============================================================
      # 7. Validate dashboard files
      # ==============================================================

      - name: Validate dashboard files
        shell: pwsh
        run: |

          $requiredFiles = @(

              "overview.svg"
              "languages.svg"
              "activity.svg"
              "repositories.svg"

          )


          $errors = @()


          foreach ($file in $requiredFiles) {

              $matches = @(
                  Get-ChildItem `
                    -Path "final-dashboard" `
                    -Recurse `
                    -Filter $file `
                    -File
              )


              if ($matches.Count -eq 0) {

                  $errors += `
                    "Missing required file: $file"

                  continue
              }


              if ($matches.Count -gt 1) {

                  $errors += `
                    "Duplicate file detected: $file"

                  continue
              }


              $match = $matches[0]


              if ($match.Length -le 100) {

                  $errors += `
                    "Suspiciously small file: $file ($($match.Length) bytes)"

                  continue
              }


              Write-Host `
                "Validated: $($match.FullName) [$($match.Length) bytes]"

          }


          if ($errors.Count -gt 0) {

              Write-Host ""
              Write-Host "Validation errors:"


              foreach ($error in $errors) {

                  Write-Host " - $error"

              }


              exit 1
          }


          Write-Host ""
          Write-Host "All dashboard files are valid."


      # ==============================================================
      # 8. Collect dashboard metadata
      # ==============================================================

      - name: Collect dashboard metadata
        id: metadata

        if: env.ENABLE_METADATA == '1'

        shell: pwsh

        env:

          SELECTED_RUNS:
            ${{ steps.find-runs.outputs.runs }}

          REPOSITORY:
            ${{ github.repository }}

          WORKFLOW_NAME:
            ${{ github.workflow }}

          WORKFLOW_RUN_ID:
            ${{ github.run_id }}

          WORKFLOW_RUN_NUMBER:
            ${{ github.run_number }}

          WORKFLOW_ATTEMPT:
            ${{ github.run_attempt }}

          EVENT_NAME:
            ${{ github.event_name }}

          ACTOR:
            ${{ github.actor }}

          REF_NAME:
            ${{ github.ref_name }}

          SHA:
            ${{ github.sha }}


        run: |

          $generatedAt =
            (Get-Date).ToUniversalTime().ToString("o")


          $files =
            Get-ChildItem `
              -Path "final-dashboard" `
              -Recurse `
              -Filter "*.svg" `
              -File


          $fileMetadata = @()


          foreach ($file in $files) {

              $sha256 =
                (
                  Get-FileHash `
                    -Path $file.FullName `
                    -Algorithm SHA256
                ).Hash


              $sha512 =
                (
                  Get-FileHash `
                    -Path $file.FullName `
                    -Algorithm SHA512
                ).Hash


              $relativePath =
                $file.FullName.Substring(
                    (Resolve-Path "final-dashboard").Path.Length + 1
                ).Replace("\", "/")


              $fileMetadata += [ordered]@{

                  name =
                    $file.Name

                  path =
                    $relativePath

                  size_bytes =
                    $file.Length

                  hashes = [ordered]@{

                      sha256 =
                        $sha256

                      sha512 =
                        $sha512

                  }

                  hash_algorithms = @(
                      "SHA-256"
                      "SHA-512"
                  )

                  last_write_time_utc =
                    $file.LastWriteTimeUtc.ToString("o")

              }

          }


          $selectedRuns =
            $env:SELECTED_RUNS |
            ConvertFrom-Json


          $metadata = [ordered]@{

              schema =
                "github-dashboard-metadata/v2"


              dashboard = [ordered]@{

                  name =
                    "GitHub Dashboard"

                  repository =
                    $env:REPOSITORY

                  generated_at_utc =
                    $generatedAt

              }


              integrity = [ordered]@{

                  purpose =
                    "File integrity verification"

                  algorithms = @(
                      "SHA-256"
                      "SHA-512"
                  )

                  encryption =
                    $false

              }


              workflow = [ordered]@{

                  name =
                    $env:WORKFLOW_NAME

                  run_id =
                    $env:WORKFLOW_RUN_ID

                  run_number =
                    $env:WORKFLOW_RUN_NUMBER

                  attempt =
                    $env:WORKFLOW_ATTEMPT

                  event =
                    $env:EVENT_NAME

                  actor =
                    $env:ACTOR

                  ref =
                    $env:REF_NAME

                  commit_sha =
                    $env:SHA

              }


              runner = [ordered]@{

                  os =
                    $env:RUNNER_OS

                  arch =
                    $env:RUNNER_ARCH

                  name =
                    $env:RUNNER_NAME

              }


              source_workflows =
                $selectedRuns


              files =
                $fileMetadata

          }


          $metadata |

            ConvertTo-Json `
              -Depth 20 |

            Set-Content `
              -Path "dashboard-metadata/metadata.json" `
              -Encoding UTF8


          Write-Host ""
          Write-Host "Metadata generated:"
          Get-Content "dashboard-metadata/metadata.json"


      # ==============================================================
      # 9. Inject XML metadata into SVG files
      # ==============================================================

      - name: Inject SVG metadata

        if: env.ENABLE_METADATA == '1'

        shell: pwsh


        env:

          REPOSITORY:
            ${{ github.repository }}

          WORKFLOW_NAME:
            ${{ github.workflow }}

          WORKFLOW_RUN_ID:
            ${{ github.run_id }}

          WORKFLOW_RUN_NUMBER:
            ${{ github.run_number }}

          WORKFLOW_ATTEMPT:
            ${{ github.run_attempt }}

          EVENT_NAME:
            ${{ github.event_name }}

          ACTOR:
            ${{ github.actor }}

          REF_NAME:
            ${{ github.ref_name }}

          SHA:
            ${{ github.sha }}


        run: |

          $generatedAt =
            (Get-Date).ToUniversalTime().ToString("o")


          function Escape-Xml {

              param(

                  [AllowNull()]
                  [string]$Value

              )


              if ($null -eq $Value) {
                  return ""
              }


              return $Value `
                .Replace("&", "&amp;") `
                .Replace("<", "&lt;") `
                .Replace(">", "&gt;") `
                .Replace('"', "&quot;") `
                .Replace("'", "&apos;")

          }


          $svgFiles =
            Get-ChildItem `
              -Path "final-dashboard" `
              -Recurse `
              -Filter "*.svg" `
              -File


          foreach ($file in $svgFiles) {

              $content =
                Get-Content `
                  -Path $file.FullName `
                  -Raw `
                  -Encoding UTF8


              $relativePath =
                $file.FullName.Substring(
                    (Resolve-Path "final-dashboard").Path.Length + 1
                ).Replace("\", "/")


              $metadata = @"
<metadata>
  <dashboard>
    <name>$(Escape-Xml "GitHub Dashboard")</name>
    <repository>$(Escape-Xml $env:REPOSITORY)</repository>
    <file>$(Escape-Xml $relativePath)</file>
    <generated-at-utc>$(Escape-Xml $generatedAt)</generated-at-utc>
    <workflow>$(Escape-Xml $env:WORKFLOW_NAME)</workflow>
    <workflow-run-id>$(Escape-Xml $env:WORKFLOW_RUN_ID)</workflow-run-id>
    <workflow-run-number>$(Escape-Xml $env:WORKFLOW_RUN_NUMBER)</workflow-run-number>
    <workflow-attempt>$(Escape-Xml $env:WORKFLOW_ATTEMPT)</workflow-attempt>
    <event>$(Escape-Xml $env:EVENT_NAME)</event>
    <actor>$(Escape-Xml $env:ACTOR)</actor>
    <ref>$(Escape-Xml $env:REF_NAME)</ref>
    <commit-sha>$(Escape-Xml $env:SHA)</commit-sha>
  </dashboard>
</metadata>
"@


              if ($content -match '<metadata\b') {

                  Write-Host `
                    "Existing metadata detected in $($file.Name)."


                  $content =
                    $content -replace `
                      '(?s)<metadata\b[^>]*>.*?</metadata>',
                      ''

              }


              $newContent =
                $content -replace `
                  '(<svg\b[^>]*>)',
                  "`$1`n$metadata"


              if ($newContent -eq $content) {

                  Write-Error `
                    "Failed to inject metadata into $($file.Name)"

                  exit 1

              }


              Set-Content `
                -Path $file.FullName `
                -Value $newContent `
                -Encoding UTF8


              Write-Host `
                "Metadata injected: $($file.Name)"

          }


      # ==============================================================
      # 10. Calculate final cryptographic hashes
      # ==============================================================

      - name: Calculate final file hashes

        if: env.ENABLE_METADATA == '1'

        shell: pwsh

        run: |

          $finalFiles = @()


          foreach ($file in Get-ChildItem `
              -Path "final-dashboard" `
              -Recurse `
              -Filter "*.svg" `
              -File) {


              $sha256 =
                (
                  Get-FileHash `
                    -Path $file.FullName `
                    -Algorithm SHA256
                ).Hash


              $sha512 =
                (
                  Get-FileHash `
                    -Path $file.FullName `
                    -Algorithm SHA512
                ).Hash


              $relativePath =
                $file.FullName.Substring(
                    (Resolve-Path "final-dashboard").Path.Length + 1
                ).Replace("\", "/")


              $finalFiles += [ordered]@{

                  name =
                    $file.Name

                  path =
                    $relativePath

                  size_bytes =
                    $file.Length

                  hashes = [ordered]@{

                      sha256 =
                        $sha256

                      sha512 =
                        $sha512

                  }

                  hash_algorithms = @(
                      "SHA-256"
                      "SHA-512"
                  )

              }

          }


          $finalMetadata = [ordered]@{

              schema =
                "github-dashboard-metadata/v2"


              integrity = [ordered]@{

                  purpose =
                    "File integrity verification"

                  algorithms = @(
                      "SHA-256"
                      "SHA-512"
                  )

                  encryption =
                    $false

              }


              generated_at_utc =
                (Get-Date).ToUniversalTime().ToString("o")


              repository =
                "${{ github.repository }}"


              workflow = [ordered]@{

                  name =
                    "${{ github.workflow }}"

                  run_id =
                    "${{ github.run_id }}"

                  run_number =
                    "${{ github.run_number }}"

                  attempt =
                    "${{ github.run_attempt }}"

              }


              source_commit =
                "${{ github.sha }}"


              files =
                $finalFiles

          }


          $finalMetadata |

            ConvertTo-Json `
              -Depth 20 |

            Set-Content `
              -Path "dashboard-metadata/final-metadata.json" `
              -Encoding UTF8


          Write-Host ""
          Write-Host "Final cryptographic hashes:"
          $finalMetadata.files |
            ConvertTo-Json `
              -Depth 10


      # ==============================================================
      # 11. Checkout gh-pages
      # ==============================================================

      - name: Checkout gh-pages

        uses: actions/checkout@v4

        with:

          ref: gh-pages
          path: gh-pages
          fetch-depth: 1


      # ==============================================================
      # 12. Prepare published dashboard
      # ==============================================================

      - name: Prepare published dashboard

        shell: pwsh

        run: |

          $publishPath =
            "gh-pages/github-stats"


          if (Test-Path $publishPath) {

              Remove-Item `
                $publishPath `
                -Recurse `
                -Force

          }


          New-Item `
            -ItemType Directory `
            -Path $publishPath `
            -Force | Out-Null


          Write-Host `
            "Publication directory prepared: $publishPath"


      # ==============================================================
      # 13. Publish dashboard files
      # ==============================================================

      - name: Publish dashboard files

        shell: pwsh

        run: |

          $files = @(

              "overview.svg"
              "languages.svg"
              "activity.svg"
              "repositories.svg"

          )


          foreach ($file in $files) {

              $source =
                Get-ChildItem `
                  -Path "final-dashboard" `
                  -Recurse `
                  -Filter $file `
                  -File |
                Select-Object -First 1


              if (-not $source) {

                  Write-Error `
                    "Cannot publish '$file'."

                  exit 1

              }


              $destination =
                Join-Path `
                  "gh-pages/github-stats" `
                  $file


              Copy-Item `
                -Path $source.FullName `
                -Destination $destination `
                -Force


              Write-Host `
                "Published: $file"

          }


      # ==============================================================
      # 14. Publish metadata
      # ==============================================================

      - name: Publish metadata

        if: env.ENABLE_METADATA == '1'

        shell: pwsh

        run: |

          Copy-Item `
            "dashboard-metadata/metadata.json" `
            "gh-pages/github-stats/metadata.json" `
            -Force


          Copy-Item `
            "dashboard-metadata/final-metadata.json" `
            "gh-pages/github-stats/final-metadata.json" `
            -Force


          Write-Host "Metadata files published."


      # ==============================================================
      # 15. Generate publication integrity manifest
      # ==============================================================

      - name: Generate publication manifest

        if: env.ENABLE_METADATA == '1'

        shell: pwsh

        run: |

          $publishedFiles =
            Get-ChildItem `
              -Path "gh-pages/github-stats" `
              -File


          $manifest = @()


          foreach ($file in $publishedFiles) {

              $sha256 =
                (
                  Get-FileHash `
                    -Path $file.FullName `
                    -Algorithm SHA256
                ).Hash


              $sha512 =
                (
                  Get-FileHash `
                    -Path $file.FullName `
                    -Algorithm SHA512
                ).Hash


              $manifest += [ordered]@{

                  name =
                    $file.Name

                  size_bytes =
                    $file.Length

                  hashes = [ordered]@{

                      sha256 =
                        $sha256

                      sha512 =
                        $sha512

                  }

                  hash_algorithms = @(
                      "SHA-256"
                      "SHA-512"
                  )

              }

          }


          $manifestData = [ordered]@{

              schema =
                "github-dashboard-publication-manifest/v2"


              purpose =
                "Publication integrity verification"


              generated_at_utc =
                (Get-Date).ToUniversalTime().ToString("o")


              repository =
                "${{ github.repository }}"


              branch =
                "gh-pages"


              directory =
                "github-stats"


              workflow =
                "${{ github.workflow }}"


              workflow_run_id =
                "${{ github.run_id }}"


              commit_sha =
                "${{ github.sha }}"


              integrity = [ordered]@{

                  algorithms = @(
                      "SHA-256"
                      "SHA-512"
                  )

                  encryption =
                    $false

              }


              files =
                $manifest

          }


          $manifestData |

            ConvertTo-Json `
              -Depth 20 |

            Set-Content `
              "gh-pages/github-stats/manifest.json" `
              -Encoding UTF8


          Write-Host ""
          Write-Host "Publication manifest generated."


      # ==============================================================
      # 16. Final verification
      # ==============================================================

      - name: Verify published dashboard

        shell: pwsh

        run: |

          $requiredFiles = @(

              "overview.svg"
              "languages.svg"
              "activity.svg"
              "repositories.svg"

          )


          if ($env:ENABLE_METADATA -eq "1") {

              $requiredFiles += @(

                  "metadata.json"
                  "final-metadata.json"
                  "manifest.json"

              )

          }


          $errors = @()


          foreach ($file in $requiredFiles) {

              $path =
                Join-Path `
                  "gh-pages/github-stats" `
                  $file


              if (-not (Test-Path $path)) {

                  $errors += `
                    "Published file missing: $file"

                  continue

              }


              $size =
                (Get-Item $path).Length


              if ($size -le 50) {

                  $errors += `
                    "Suspiciously small file: $file ($size bytes)"

                  continue

              }


              Write-Host `
                "OK: $file [$size bytes]"

          }


          if ($errors.Count -gt 0) {

              Write-Host ""
              Write-Host "Publication verification failed:"


              foreach ($error in $errors) {

                  Write-Host " - $error"

              }


              exit 1

          }


          Write-Host ""
          Write-Host "Dashboard publication verification passed."


          if ($env:ENABLE_METADATA -eq "1") {

              Write-Host "Metadata: ENABLED"
              Write-Host "Integrity: SHA-256 + SHA-512"

          }
          else {

              Write-Host "Metadata: DISABLED"

          }


      # ==============================================================
      # 17. Commit and push
      # ==============================================================

      - name: Commit dashboard

        shell: pwsh

        env:

          REPOSITORY:
            ${{ github.repository }}

          WORKFLOW_RUN_ID:
            ${{ github.run_id }}

          WORKFLOW_RUN_NUMBER:
            ${{ github.run_number }}

          WORKFLOW_ATTEMPT:
            ${{ github.run_attempt }}

          COMMIT_SHA:
            ${{ github.sha }}


        run: |

          Set-Location "gh-pages"


          git config `
            user.name `
            "github-actions[bot]"


          git config `
            user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add github-stats/


          $changes =
            git status --porcelain


          if (-not $changes) {

              Write-Host ""
              Write-Host "No dashboard changes detected."
              Write-Host "Nothing to commit."

              exit 0

          }


          Write-Host ""
          Write-Host "Dashboard changes detected:"
          git status --short


          $commitSubject =
            "📊 chore(dashboard): update GitHub analytics"


          $commitBody = @"
Automated GitHub dashboard synchronization.

Generated-By: github-actions[bot]
Repository: $env:REPOSITORY
Workflow-Run-ID: $env:WORKFLOW_RUN_ID
Workflow-Run-Number: $env:WORKFLOW_RUN_NUMBER
Workflow-Attempt: $env:WORKFLOW_ATTEMPT
Source-Commit: $env:COMMIT_SHA

Metadata-Enabled: $env:ENABLE_METADATA

Integrity:
- SHA-256
- SHA-512

Note:
Cryptographic hashes provide file integrity verification.
They are not encryption and do not hide file contents.
"@


          git commit `
            -m $commitSubject `
            -m $commitBody


          git push origin gh-pages


          Write-Host ""
          Write-Host "Dashboard successfully published."

