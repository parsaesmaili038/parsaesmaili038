name: Generate GitHub Analytics Dashboard

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate analytics dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: parsaesmaili038
        run: |
          python scripts/github_dashboard.py

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone \
            --depth 1 \
            --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/parsaesmaili038/parsaesmaili038.git" \
            gh-pages-temp

          mkdir -p gh-pages-temp/github-stats

          cp dist/github-stats/overview.svg \
             gh-pages-temp/github-stats/overview.svg

          cd gh-pages-temp

          git add github-stats/overview.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update GitHub analytics dashboard"
            git push origin gh-pages
          fi
