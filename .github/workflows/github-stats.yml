name: Generate GitHub Analytics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate SVG statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: parsaesmaili038
        run: |
          python scripts/github_stats.py

      - name: Publish SVGs to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch gh-pages \
            https://x-access-token:${GITHUB_TOKEN}@github.com/parsaesmaili038/parsaesmaili038.git \
            gh-pages-temp

          rm -rf gh-pages-temp/github-stats
          mkdir -p gh-pages-temp/github-stats

          cp -r dist/github-stats/* gh-pages-temp/github-stats/

          cd gh-pages-temp

          git add github-stats

          git diff --cached --quiet || git commit -m "Update GitHub analytics"

          git push origin gh-pages
